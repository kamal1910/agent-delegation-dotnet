name: Publish to NuGet

# Push a tag like v0.1.0 to publish. Uses nuget.org Trusted Publishing (OIDC), so no API key is stored.
# One-time setup: add a Trusted Publishing policy on nuget.org for this repo and publish.yml,
# and set the repository variable NUGET_USER to your nuget.org username.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - run: dotnet test -c Release
      - run: dotnet pack -c Release -p:Version=$VERSION -o artifacts
      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Push packages
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
